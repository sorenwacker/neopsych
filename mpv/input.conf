# neopsych video effects; scripts/neopsych.lua shows what each key switched to
p script-binding neopsych/colour
P script-binding neopsych/speed
Ctrl+p script-binding neopsych/amount
k script-binding neopsych/kaleido
K script-binding neopsych/sectors
# motion blur: blend each frame with the five before it, newest strongest
b script-binding neopsych/blur
# playback speed on Up/Down, like movement speed in neopsych;
# the one-minute jumps move to Shift+Up/Down
UP multiply speed 1.1
DOWN multiply speed 0.9090909
Shift+UP seek 60
Shift+DOWN seek -60
